name: bump-version

# Automates the mechanical half of the release process documented in
# CLAUDE.md's "Versioning" section: editing pyproject.toml and
# src/acsdd/__init__.py in lockstep, committing "Bump version to X.Y.Z",
# and tagging it. The human judgment call — what the new version number
# should be (semver: patch/minor/major) and what the release actually
# contains — stays a required input here rather than being inferred.
#
# Pushing the resulting vX.Y.Z tag triggers release.yml, which builds and
# publishes the binaries — that part was already automated.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "New version, without a leading v (e.g. 0.3.3)"
        required: true
        type: string
      summary:
        description: "Release summary for the bump commit body (what changed since the last version)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Validate version format
        run: |
          if ! [[ "${{ inputs.version }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version must be X.Y.Z (no leading 'v'), got: ${{ inputs.version }}"
            exit 1
          fi

      - name: Check tag doesn't already exist
        run: |
          if git ls-remote --tags origin "refs/tags/v${{ inputs.version }}" | grep -q .; then
            echo "::error::tag v${{ inputs.version }} already exists"
            exit 1
          fi

      - name: Check version is actually changing
        run: |
          current=$(grep -m1 '^version = ' pyproject.toml | sed -E 's/version = "(.*)"/\1/')
          if [ "$current" = "${{ inputs.version }}" ]; then
            echo "::error::pyproject.toml is already at version ${{ inputs.version }}"
            exit 1
          fi

      - name: Bump pyproject.toml and __init__.py
        run: |
          sed -i -E 's/^version = ".*"$/version = "${{ inputs.version }}"/' pyproject.toml
          sed -i -E 's/^__version__ = ".*"$/__version__ = "${{ inputs.version }}"/' src/acsdd/__init__.py

      - name: Commit and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml src/acsdd/__init__.py
          git commit -m "Bump version to ${{ inputs.version }}" -m "${{ inputs.summary }}"
          git tag -a "v${{ inputs.version }}" -m "v${{ inputs.version }}"

      - name: Push commit and tag
        run: git push origin main "v${{ inputs.version }}"
