name: release

on:
  push:
    tags:
      - "v*.*.*"
  # Manual fallback: a tag pushed by bump-version.yml's default GITHUB_TOKEN
  # doesn't always trigger this workflow's own `push: tags` event (GitHub
  # Actions suppresses new workflow runs triggered by the auto-provided
  # token, to avoid recursive-trigger loops). When that happens, dispatch
  # this workflow manually to build and publish the tag it missed. Dispatch
  # runs against a branch (the dispatch API rejects --ref pointed at a tag
  # whose own copy of this file predates the workflow_dispatch trigger), so
  # the tag to build is threaded through explicitly as an input instead of
  # being inferred from the triggering ref.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing vX.Y.Z tag to build and publish"
        required: true
        type: string

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x86_64
            # This line sets the binary's glibc floor, and therefore which
            # distros `curl | sh` works on: PyInstaller bundles a libpython
            # linked against the build host's libc. Measured, not inferred —
            # run the artifact under `docker run debian:12` to re-check.
            #   ubuntu-24.04 (here) -> floor glibc 2.38: Ubuntu 24.04+,
            #     Fedora 39+, Debian 13+.
            #   ubuntu-22.04 (previous) -> floor was 2.35.
            # So moving here newly drops Debian 12 (2.36) and Ubuntu 22.04
            # (2.35). RHEL/Rocky 9 and Amazon Linux 2023 (both 2.34) were
            # already out under 22.04 — this did not cost them.
            # An older image widens support, a newer one narrows it, but
            # don't downgrade to chase a distro: every image is on a
            # deprecation clock (22.04 starts brownouts 2026-09-17, fully
            # unsupported 2027-04-17). Build this leg in a manylinux
            # container instead if the floor ever has to come down.
          - os: ubuntu-24.04-arm
            target: linux-arm64
          - os: macos-14
            target: darwin-arm64
          # Intel macOS (macos-13) intentionally omitted: GitHub has been
          # winding down hosted Intel Mac runner capacity, and jobs on that
          # label can queue indefinitely, blocking the whole release (this
          # job gates `release` via `needs: build`). Apple Silicon (arm64)
          # covers current Macs; add an Intel target back only if you have
          # a dedicated/self-hosted runner for it.
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip install pyinstaller

      - name: Build binary
        run: pyinstaller packaging/acsdd.spec --distpath dist --workpath build --clean --noconfirm

      - name: Rename artifact
        run: mv dist/acsdd dist/acsdd-${{ matrix.target }}

      - name: Smoke test
        run: |
          chmod +x dist/acsdd-${{ matrix.target }}
          ./dist/acsdd-${{ matrix.target }} --version
          ./dist/acsdd-${{ matrix.target }} capability list --manifests-dir .acsdd/capabilities/_manifests
          ./dist/acsdd-${{ matrix.target }} capability validate --manifests-dir .acsdd/capabilities/_manifests
          ./dist/acsdd-${{ matrix.target }} catalog verify --capabilities-dir .acsdd/capabilities
          # pytest only ever exercises the source install, so this is the only
          # place the packaged skill asset's importlib.resources path is proven
          # to survive freezing. If acsdd.spec's `datas` list falls out of sync
          # with pyproject's package-data, this is what catches it.
          TMPREPO=$(mktemp -d)
          ./dist/acsdd-${{ matrix.target }} skill install --dir "$TMPREPO"
          # Every shipped skill, for every agent convention. `skill install`
          # already exits 1 on a missing asset, but naming them makes the
          # failure say which one — and the .agents/ leg is what proves the
          # install isn't quietly Claude Code-only.
          for s in profile-review capability-plan c4-component-diagram; do
            test -s "$TMPREPO/.agents/skills/$s/SKILL.md"
            test -s "$TMPREPO/.claude/skills/$s/SKILL.md"
          done

      - name: Checksum
        # Compute from inside dist/ so the checksum file records the bare
        # filename (e.g. "acsdd-linux-x86_64"), not "dist/acsdd-...". The
        # installer verifies against a flat temp directory with no dist/
        # subdirectory, so a path-qualified checksum entry always fails
        # `sha256sum -c` there, aborting the install under `set -e` before
        # the binary is ever copied into place.
        run: cd dist && shasum -a 256 "acsdd-${{ matrix.target }}" > "acsdd-${{ matrix.target }}.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: acsdd-${{ matrix.target }}
          path: |
            dist/acsdd-${{ matrix.target }}
            dist/acsdd-${{ matrix.target }}.sha256

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Flatten artifacts and build aggregate checksums
        run: |
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          cd release && sha256sum acsdd-* > acsdd-checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: release/*
          generate_release_notes: true
