capability:
  id: "DB-001"
  version: "1.0.0"
  name: "Identify Doctrine Entities"
  category: "DB"
  description: >
    Introspects the Doctrine entity mapping currently defined in the
    repository — entities, fields, relations, indexes — and cross-checks it
    against the live database schema to surface any drift. Read-only: makes
    no file or database changes. Serves as the prerequisite inventory step
    for DB-002, DB-003, and DB-004.

  inputs:
    - name: "target-entity"
      type: "string"
      required: false
      description: >
        Fully-qualified entity class name to filter the inventory to (e.g.
        App\Entity\Invoice). Omit to inventory all entities.

  outputs:
    - name: "entity-inventory"
      type: "json"
      pattern: "reports/entity-inventory-*.json"
    - name: "diff-report"
      type: "markdown"
      pattern: "reports/DB-001-diff-*.md"

  dependencies: []

  adapters:
    - stack: "php-symfony-doctrine"
      adapter-id: "DB-001-PHP-SYM44-MYSQL8"

  profile_constraints:
    - "php:^7.1.3"
    - "symfony/framework-bundle:~4.4"
    - "doctrine/orm:^2.6"
    - "doctrine/doctrine-bundle:^1.12"
    - "doctrine/dbal:>=2.10"
    - "mysql:>=8.0"

  quality_gates:
    - "static-analysis:phpstan-level-6"
    - "test:unit-passing"

  token_budget:
    planning: 1500
    implementation: 3000
    validation: 1000

  security_constraints:
    - "input-validation-required"
