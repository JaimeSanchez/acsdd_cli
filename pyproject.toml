[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "acsdd"
version = "0.5.1"
description = "CLI for the ACSDD framework: capability manifests, the capability catalog, and repository engineering profiles."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "click>=8.1",
    "PyYAML>=6.0",
    "jsonschema>=4.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
]

[project.scripts]
acsdd = "acsdd.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"acsdd.schemas" = ["*.json"]
# Also has to be listed in packaging/acsdd.spec's `datas` — PyInstaller does
# not read setuptools package-data. See the note in src/acsdd/skills.py.
"acsdd.assets" = ["claude/skills/*/SKILL.md"]
